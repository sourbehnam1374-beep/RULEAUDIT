[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleaudit"
version = "0.2.1"
description = "Outcome-free structural screening for deterministic additive clinical scores."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Behnam Sour", email = "sourbehnam1374@gmail.com"},
]
keywords = ["clinical decision rules", "structural screening", "sensitivity analysis", "synthetic data", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "SALib>=1.5.2",
    "scikit-learn>=1.3",
    "tabulate>=0.9",  # for to_markdown()
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ruleaudit = "ruleaudit.cli:main"

[project.urls]
Homepage = "https://github.com/sourbehnam1374-beep/ruleaudit"
Issues = "https://github.com/sourbehnam1374-beep/ruleaudit/issues"

[tool.setuptools.packages.find]
include = ["ruleaudit*"]
